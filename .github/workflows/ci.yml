name: ci

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Public repository: GitHub-hosted runners are free and isolated per job.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.10", asset: linux_x64.tar.gz }
          - { os: ubuntu-latest,  python: "3.13", asset: linux_x64.tar.gz }
          - { os: macos-latest,   python: "3.13", asset: darwin_arm64.tar.gz }
          - { os: windows-latest, python: "3.13", asset: windows_x64.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - name: Install gitleaks (POSIX)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_${{ matrix.asset }}" \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
      - name: Install gitleaks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_${{ matrix.asset }}" -OutFile gitleaks.zip
          Expand-Archive gitleaks.zip -DestinationPath "$env:RUNNER_TEMP\gl"
          "$env:RUNNER_TEMP\gl" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # %TEMP% is under AppData\Local\Temp, which the scanner skips on purpose,
          # so fixtures written there would be invisible to the code under test.
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\svt" | Out-Null
          "TMP=$env:RUNNER_TEMP\svt"    | Out-File $env:GITHUB_ENV -Append
          "TEMP=$env:RUNNER_TEMP\svt"   | Out-File $env:GITHUB_ENV -Append
          "TMPDIR=$env:RUNNER_TEMP\svt" | Out-File $env:GITHUB_ENV -Append
      - run: gitleaks version
      - run: pip install --quiet pytest
      - run: python -m pytest test_secret_vacuum.py -q
      # The no-framework entry point is documented, so it is tested too.
      - run: python test_secret_vacuum.py

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install --quiet bandit
      # B404/B603 are inherent: we shell out to gitleaks and git with argument
      # lists and never shell=True. Anything above low severity fails the build.
      - run: bandit -r secret_vacuum.py verify.py --severity-level medium

  scan-self:
    # Scans this repository only. It never points the scanner at the runner's filesystem.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
      - name: No secrets in the working tree
        run: gitleaks dir . --no-banner --redact
      - name: No secrets anywhere in history
        # The ignore file holds fingerprints of this repo's own test fixtures in
        # commits already pushed; see the file for why they are not rewritten.
        run: |
          gitleaks git . --log-opts="--all" --no-banner --redact \
            --gitleaks-ignore-path .github/gitleaks-history-ignore
